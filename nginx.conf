# --- Django app ---
server {
    listen 80;
    server_name {{DOMAIN}};

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    location /static/ {
        alias {{PROJECT_DIR}}/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        # Sirve archivos .gz pre-generados por Whitenoise (ManifestStaticFilesStorage)
        gzip_static on;
    }

    location /media/ {
        alias {{PROJECT_DIR}}/media/;
        expires 7d;
        add_header Cache-Control "public";
        # Los uploads de usuarios nunca deben interpretarse como HTML/JS activo
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
    }

    # Nunca servir dotfiles (.git, .env, ...)
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:{{APP_PORT}};
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
